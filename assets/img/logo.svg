<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Sports Maven">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241c0f"/><stop offset="1" stop-color="#0a0804"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e7b8"/><stop offset=".5" stop-color="#b8903f"/><stop offset="1" stop-color="#6f4f1f"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".18" r=".8"><stop offset="0" stop-color="#e9d49a" stop-opacity=".22"/><stop offset="1" stop-color="#e9d49a" stop-opacity="0"/></radialGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcb96f"/><stop offset="1" stop-color="#7d5a25"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd291"/><stop offset="1" stop-color="#94702f"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3cf"/><stop offset="1" stop-color="#b88d3f"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4c47e"/><stop offset="1" stop-color="#876428"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d5a25"/><stop offset=".5" stop-color="#f3e2aa"/><stop offset="1" stop-color="#7d5a25"/></linearGradient>
  </defs>
  <rect x="5" y="5" width="246" height="246" rx="62" fill="url(#tile)"/>
  <rect x="5" y="5" width="246" height="246" rx="62" fill="url(#glow)"/>
  <rect x="7" y="7" width="242" height="242" rx="60" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- four steps, one for each sport -->
  <g>
    <rect x="43" y="80" width="38" height="120" rx="4" fill="url(#b1)"/>
    <rect x="87" y="64" width="38" height="136" rx="4" fill="url(#b2)"/>
    <rect x="131" y="46" width="38" height="154" rx="4" fill="url(#b3)"/>
    <rect x="175" y="58" width="38" height="142" rx="4" fill="url(#b4)"/>
    <g fill="#fff" opacity=".3"><rect x="43" y="80" width="3" height="120" rx="1.5"/><rect x="87" y="64" width="3" height="136" rx="1.5"/><rect x="131" y="46" width="3" height="154" rx="1.5"/><rect x="175" y="58" width="3" height="142" rx="1.5"/></g>
    <rect x="35" y="200" width="186" height="11" rx="5.5" fill="url(#base)"/>
  </g>

  <!-- athletes: hoop, ball, jump, football -->
  <g fill="none" stroke="#17110a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1 hoop -->
    <circle cx="63" cy="122" r="7.5" fill="#17110a" stroke="none"/>
    <path d="M63 133 61 162M61 162 54 190M61 162 70 190M62 142 75 150M62 142 51 152"/>
    <ellipse cx="62" cy="158" rx="14" ry="6" transform="rotate(-12 62 158)" stroke-width="4"/>
    <!-- 2 ball -->
    <circle cx="100" cy="113" r="7.5" fill="#17110a" stroke="none"/>
    <path d="M101 124 97 154M97 154 89 188M97 154 110 173 106 189M100 133 110 137"/>
    <circle cx="116" cy="136" r="7" fill="#17110a" stroke="none"/>
    <circle cx="117" cy="116" r="3.2" fill="#17110a" stroke="none"/>
    <!-- 3 jump -->
    <circle cx="150" cy="116" r="7.5" fill="#17110a" stroke="none"/>
    <path d="M150 127 150 162M150 136 137 116M150 136 163 116M150 162 143 184M150 162 157 184"/>
    <path d="M134 192 167 187" stroke-width="7"/>
    <!-- 4 football -->
    <circle cx="195" cy="108" r="7.5" fill="#17110a" stroke="none"/>
    <path d="M194 119 188 153M193 128 180 141M193 128 208 121M188 153 184 173 180 191M188 153 202 169 200 181"/>
    <circle cx="205" cy="190" r="7" fill="#17110a" stroke="none"/>
  </g>
</svg>
