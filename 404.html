<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Sports Maven</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; color: #f5eddc; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: radial-gradient(60% 50% at 80% 0%, rgba(205,178,122,.35), transparent 60%), radial-gradient(50% 40% at 0% 30%, rgba(239,227,194,.2), transparent 60%), #0b0a09; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(4rem, 14vw, 8rem); margin: 0; line-height: 1; letter-spacing: -.04em; background: linear-gradient(120deg, #fffaf0, #efe3c2 55%, #cdb27a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #b3a68d; font-size: 1.1rem; }
  a { display: inline-block; margin-top: 14px; padding: 13px 26px; border-radius: 99px; color: #1c1407; text-decoration: none; font-weight: 600; background: linear-gradient(120deg, #fffaf0, #efe3c2 55%, #cdb27a); box-shadow: 0 8px 30px -6px rgba(205,178,122,.7); }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>That page went out of bounds.</p>
    <a id="home" href="/">Back to the home page</a>
  </main>
  <script>
    // Works on both username.github.io/<repo>/ (project site) and a custom domain.
    var parts = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
    document.getElementById('home').href = base;
  </script>
</body>
</html>
